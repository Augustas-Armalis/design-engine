<!doctype html><meta charset="utf-8"><title>X posts</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.0.18/index.css">
<link rel="stylesheet" href="buttons-2.css">
<style>
/* X post canvases (knowledge/web/x-design-posts.md): 7:8 = 1760x2000, solid near-black / near-white, one artifact, no text on the canvas */
html,body{margin:0}body{font-family:"Inter Variable",Inter,system-ui;-webkit-font-smoothing:antialiased}
.cv{width:1760px;height:2000px;display:grid;place-items:center;position:relative;overflow:hidden}
.dark{background:#0b0b0d;color:#f4f4f5}.light{background:#f6f6f5;color:#0b0c10}
.btns{display:grid;grid-template-columns:repeat(2,auto);gap:96px 80px;justify-items:center;align-items:center;zoom:2.15}
.btns .b2{justify-self:center}
/* usage meter */
.m{zoom:2.4;width:420px;border-radius:22px;padding:20px 22px 18px;font-size:14px}
.light .m{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04),0 18px 40px -18px rgba(0,0,0,.18)}
.dark .m{background:#151518;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(0,0,0,.6),0 24px 50px -20px rgba(0,0,0,.8)}
.m .hd{display:flex;align-items:center;justify-content:space-between}.m .t{font-weight:600;font-size:15px;letter-spacing:-.01em}
.m .chip{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500}
.light .chip{background:#eef2ff;color:#2f4fd6}.dark .chip{background:rgba(101,140,255,.14);color:#a9c0ff}
.m .sub{margin-top:3px;font-size:13px;color:#77777f}.dark .m .sub{color:#8e8e98}
.m .big{margin-top:18px;display:flex;align-items:baseline;gap:8px}.m .big b{font-size:34px;font-weight:550;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.m .big span{font-size:14px;color:#77777f}.dark .m .big span{color:#8e8e98}
.bar{margin-top:14px;height:10px;border-radius:99px;display:flex;gap:3px;overflow:hidden}
.light .bar{background:#eef0f4}.dark .bar{background:rgba(255,255,255,.07)}
.bar i{display:block;height:100%;border-radius:99px}
.lg{margin-top:16px;display:grid;gap:2px}.lg div{display:flex;align-items:center;height:30px;gap:10px;font-size:13.5px}
.lg s{width:8px;height:8px;border-radius:3px}.lg em{font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums}.lg u{text-decoration:none;width:42px;text-align:right;font:12px ui-monospace,monospace;color:#8b8b93}
.ft{margin-top:14px;padding-top:14px;display:flex;align-items:center;gap:10px;font-size:13.5px}
.light .ft{border-top:1px solid rgba(0,0,0,.07)}.dark .ft{border-top:1px solid rgba(255,255,255,.08)}
.sw{width:32px;height:19px;border-radius:99px;background:#3d6bff;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.sw::after{content:"";position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.ft .b2{height:36px;font-size:13.5px;margin-left:auto;padding:0 5px 0 14px;gap:9px}.ft .b2 .t{width:26px;height:26px}
.light .ft .b2-tile{color:#0b0c10;background:rgba(0,0,0,.04);box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}.light .ft .b2-tile .t{background:#0b0c10;color:#fff}
</style>
<body>
<script>
const A='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>'
const D='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>'
const P='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M3 8h10"/></svg>'
const btns=`<a class="b2 b2-gloss">Download free</a><a class="b2 b2-glow">Get started</a>
<a class="b2 b2-rim">Book a demo ${A}</a><a class="b2 b2-tile">Explore the product <span class="t">${A}</span></a>
<a class="b2 b2-split"><span>${D} Download</span><span>macOS ▾</span></a><a class="b2 b2-live"><span class="d"></span>Watch it live</a>
<a class="b2 b2-app"><span class="ic">${D}</span><span class="tx">Download for Mac<small>Free · macOS 14+</small></span><span class="go">${A}</span></a><a class="b2 b2-soft sq">Talk to sales</a>
<a class="b2 b2-key">Start building</a><a class="b2 b2-beam">Request access</a>`
const meter=`<div class="m"><div class="hd"><span class="t">Credits</span><span class="chip">Pro plan</span></div>
<div class="sub">Resets Nov 1 · 19 days left</div>
<div class="big"><b>68,240</b><span>of 100,000 used</span></div>
<div class="bar"><i style="width:41%;background:#3d6bff"></i><i style="width:19%;background:#7c9dff"></i><i style="width:8.2%;background:#bccdff"></i></div>
<div class="lg"><div><s style="background:#3d6bff"></s>Agent runs<em>41,050</em><u>60%</u></div><div><s style="background:#7c9dff"></s>Web search<em>19,020</em><u>28%</u></div><div><s style="background:#bccdff"></s>Voice notes<em>8,170</em><u>12%</u></div></div>
<div class="ft"><span class="sw"></span>Auto top-up at 90%<a class="b2 b2-tile">Add credits <span class="t">${P}</span></a></div></div>`
const [kind,theme]=(location.hash.slice(1)||'buttons-dark').split('-')
document.body.innerHTML=`<div class="cv ${theme}" data-theme="${theme}">${kind==='buttons'?`<div class="btns">${btns}</div>`:meter}</div>`
</script>
